<!DOCTYPE html>
<html>
<head>
    <title>Navigation Menu</title>

    <style>
        ul {
            list-style-type: none;
            background-color: #333;
            overflow: hidden;
            padding: 0;
        }

        li {
            float: left;
        }

        li a {
            display: block;
            color: white;
            padding: 12px 15px;
            text-decoration: none;
        }

        li a:hover {
            background-color: black;
        }
    </style>
</head>
<body>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Courses</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

</body>
</html>
