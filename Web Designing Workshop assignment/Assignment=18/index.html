
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ABC College Admission 2026</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        header {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 15px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid gray;
            padding: 5px;
        }

        main {
            width: 350px;
            margin: auto;
        }

        fieldset {
            margin-top: 10px;
        }

        footer {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 5px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h2>ABC College Admission 2026</h2>
    </header>

    <main>

        <h4>Courses and Fees</h4>

        <table>
            <tr>
                <th>Course</th>
                <th>Seats</th>
                <th>Fees</th>
            </tr>

            <tr>
                <td>B.Tech CSE</td>
                <td>120</td>
                <td>90,000</td>
            </tr>

            <tr>
                <td>B.Tech ECE</td>
                <td>60</td>
                <td>85,000</td>
            </tr>
        </table>

        <form action="submit.php" method="post">

            <fieldset>
                <legend>Application Form</legend>

                <label for="name">Name:</label>
                <br>
                <input type="text"
                       id="name"
                       name="name"
                       required>

                <br><br>

                <label for="email">Email:</label>
                <br>
                <input type="email"
                       id="email"
                       name="email"
                       required>

                <br><br>

                <label for="course">Course:</label>
                <br>

                <select id="course" name="course" required>
                    <option value="B.Tech CSE">B.Tech CSE</option>
                    <option value="B.Tech ECE">B.Tech ECE</option>
                </select>

                <br><br>

                <label for="statement">Statement:</label>
                <br>

                <textarea id="statement"
                          name="statement"
                          rows="3"
                          cols="30"></textarea>

                <br><br>

                <button type="submit">Apply</button>

            </fieldset>

        </form>

    </main>

    <footer>
        &copy; 2026 ABC College
    </footer>

</body>
</html>
