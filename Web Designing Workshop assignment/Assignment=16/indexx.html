<!DOCTYPE html>
<html>
<head>
    <title>Select and Textarea</title>
</head>
<body>

    <form>

        <label for="course">Course:</label>

        <select id="course">
            <option>ECE</option>
            <option>CSE</option>
            <option>AI-ML</option>
            <option>IT</option>
        </select>

        <br><br>

        <label for="feedback">Feedback:</label>
        <br>

        <textarea id="feedback"
                  rows="4"
                  cols="30"
                  placeholder="Write here..."></textarea>

        <br><br>

        <button type="submit">Submit</button>

        <button type="reset">Reset</button>

        <button type="button"
                onclick="alert('Hello!')">
            Click Me
        </button>

    </form>

</body>
</html>
